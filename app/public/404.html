<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Qubeterra Institute</title>
    <script type="text/javascript">
      // Preserve deep links on the custom root domain and let index.html restore the route.
      (function (l) {
        var route = l.pathname.replace(/^\/+/, '');
        var search = l.search
          ? '&' + l.search.slice(1).replace(/&/g, '~and~')
          : '';
        l.replace(
          l.protocol + '//' + l.host + '/?/' +
          route.replace(/&/g, '~and~') + search + l.hash
        );
      }(window.location));
    </script>
  </head>
  <body></body>
</html>
